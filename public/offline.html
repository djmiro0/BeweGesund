<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#9b2b42" />
    <title>Offline | Bewegesund</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f4fbff;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        background:
          radial-gradient(
            circle at top right,
            rgba(155, 43, 66, 0.14),
            transparent 34rem
          ),
          #f4fbff;
      }

      main {
        width: min(100%, 34rem);
        border: 1px solid rgba(23, 32, 51, 0.12);
        border-radius: 1.75rem;
        background: rgba(255, 252, 247, 0.96);
        padding: clamp(1.4rem, 5vw, 2.5rem);
        box-shadow: 0 28px 80px rgba(83, 57, 20, 0.16);
      }

      img {
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
      }

      p {
        color: #657083;
        line-height: 1.65;
      }

      .eyebrow {
        margin: 1.1rem 0 0;
        color: #9b2b42;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.35rem 0 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 0.95;
        text-transform: uppercase;
      }

      button {
        width: 100%;
        min-height: 3rem;
        margin-top: 0.75rem;
        border: 0;
        border-radius: 999px;
        background: #172033;
        color: #fffaf3;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      .english {
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid rgba(23, 32, 51, 0.1);
        font-size: 0.88rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <p class="eyebrow">Bewegesund</p>
      <h1>Du bist offline</h1>
      <p>
        Prüfe deine Internetverbindung und versuche es erneut. Private
        Kontodaten werden aus Sicherheitsgründen nicht offline gespeichert.
      </p>
      <button type="button" onclick="window.location.reload()">
        Erneut versuchen
      </button>
      <p class="english" lang="en">
        You are offline. Check your connection and try again. Private account
        data is not stored for offline use.
      </p>
    </main>
  </body>
</html>
